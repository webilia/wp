name: Shared WordPress services
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: xml, xmlreader
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install companion UI source for contract tests
        env:
          UI_REF: 6a11ab714f9b1fb34fb02683a04ef5e63aad9476
        run: |
          mkdir -p vendor/webilia/ui
          curl --fail --silent --show-error --location "https://api.github.com/repos/webilia/webilia-ui/tarball/${UI_REF}" | tar -xz --strip-components=1 -C vendor/webilia/ui
      - run: composer validate --strict
      - run: composer run test
        env:
          WEBILIA_UI_PATH: ${{ github.workspace }}/vendor/webilia/ui
      - run: npm ci
      - run: npm test
        env:
          WEBILIA_UI_PATH: ${{ github.workspace }}/vendor/webilia/ui
